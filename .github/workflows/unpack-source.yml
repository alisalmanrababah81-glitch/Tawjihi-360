name: Unpack application source
on:
  push:
    branches: [main]
    paths:
      - source.tar.gz
      - .github/workflows/unpack-source.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract source archive
        run: |
          tar -xzf source.tar.gz
          rm source.tar.gz
          rm -f .github/workflows/unpack-source.yml
      - name: Commit application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Upload completed Tawjihi 360 application"
          git push origin main
